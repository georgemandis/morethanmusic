name = midihelpers
category = Hardware
authors = [George Mandis](https://george.mand.is)
url = https://morethanmusic.dev/helpers/
sentence = One class per MIDI device: PipSqueak, Midi Fighter, Launchpad Mini MK3, Circuit Playground, Trinkeys, and AnyMidi for everything else.
paragraph = javax.sound.midi only, so nothing else to install. Each helper connects by port name, decodes what the device sends into fields you read in draw(), sends LED and pixel commands back, calls sketch functions like padPressed() when you define them, and keeps a keyboard stand-in for when there is no device. The same API exists for Python Mode and p5.js.
